# Rate limit zones - 5 req/s pour le login (anti brute-force), 1 req/s pour register (anti-spam)
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth_register:10m rate=1r/s;
# Nominatim policy : 1 req/s max. Per-IP suffit pour un trafic faible ; pour une vraie
# limite globale, remplacer la cle par une constante (ex. "$server_name").
limit_req_zone $binary_remote_addr zone=nominatim:10m rate=1r/s;

# Resolver requis pour resoudre nominatim.openstreetmap.org au runtime (proxy HTTPS)
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Headers de securite appliques a toutes les reponses
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS - decommenter UNIQUEMENT quand le site est entierement servi en HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Login et register : rate limit strict (anti brute-force / spam)
    location = /api/auth/login {
        limit_req zone=auth_login burst=10 nodelay;
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/register {
        limit_req zone=auth_register burst=3 nodelay;
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Nominatim : contourne le CORS navigateur et force un User-Agent conforme
    # a leur usage policy. La variable $nominatim oblige nginx a resoudre le DNS au
    # runtime (sinon nginx echoue au demarrage si l'hote n'est pas joignable).
    location /nominatim/ {
        limit_req zone=nominatim burst=5 nodelay;

        set $nominatim "nominatim.openstreetmap.org";
        # Avec une variable dans proxy_pass, nginx ne reecrit PAS le prefixe de la
        # location -> on le strip explicitement, sinon Nominatim renvoie un 302 vers
        # /ui/search.html que le navigateur tente de suivre (bloque par le CSP).
        rewrite ^/nominatim/(.*)$ /$1 break;
        proxy_pass https://$nominatim;
        proxy_ssl_server_name on;
        proxy_ssl_name $nominatim;
        proxy_set_header Host $nominatim;
        proxy_set_header User-Agent "NBAFanFinder/1.0 (https://nbafanfinder.up.railway.app)";
        # Accept JSON explicite : evite toute negociation de contenu vers leur UI HTML
        proxy_set_header Accept "application/json";
        proxy_set_header Accept-Language "fr,en;q=0.8";

        # Ne jamais relayer cookies ou auth vers un service externe
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        # Filet de securite : si Nominatim renvoie un 3xx, on l'absorbe au lieu de le
        # transmettre au navigateur (qui re-tomberait sur du cross-origin bloque CSP).
        proxy_intercept_errors on;
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
