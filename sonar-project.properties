# Identité du projet
sonar.projectKey=NBAFanFinder
sonar.projectName=NBAFanFinder
sonar.projectVersion=0.0.1

# Sources
sonar.sources=Backend/src/main/java,Frontend/src
sonar.tests=Backend/src/test/java,Frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*Test.java,**/*IntegrationTest.java

# Encodage
sonar.sourceEncoding=UTF-8

# Java
sonar.java.binaries=Backend/target/classes
sonar.java.test.binaries=Backend/target/test-classes
sonar.java.source=17

# Couverture
sonar.coverage.jacoco.xmlReportPaths=Backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info

# Exclusions du calcul de couverture (code non métier)
sonar.coverage.exclusions=\
  **/DTOs/**,\
  **/Entities/**,\
  **/Config/**,\
  **/BackendApplication.java,\
  **/main.tsx,\
  **/vite-env.d.ts,\
  **/types/**,\
  **/styles/**

# Hôte et token : fournis exclusivement via les variables d'environnement
# SONAR_HOST_URL et SONAR_TOKEN. NE JAMAIS commiter de token ici.